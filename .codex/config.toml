# Project settings for Codex in this repository. Codex reads AGENTS.md natively;
# keep repository policy there, not here.
#
# Sandbox network access is left at your own setting. The first catalog build in a
# fresh worktree downloads the pinned model files, and discovery reads official
# sources, so do not switch it off here.

[features]
# Runs .codex/hooks.json, which shares scripts/harness/ with the Claude Code hooks.
hooks = true

[shell_environment_policy]
inherit = "all"
# Provider keys never reach commands run in this repository.
exclude = ["AWS_*", "AZURE_*", "ANTHROPIC_*", "OPENAI_API_KEY"]
