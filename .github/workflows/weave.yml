name: Weave app and API

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: weave-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  weave-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      # Compiles the API handlers, then type-checks and builds the app.
      - run: bun run --filter '@weave/*' build
      # Route table, design-system use, the dev /api bridge, entry files and handlers.
      - run: bun run --filter '@weave/*' test
      - run: git diff --exit-code
