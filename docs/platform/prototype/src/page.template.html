<title>Weave prototype</title>
<link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="prototype.css">
<!-- design-system/brand/icons.svg, inlined unchanged so <use href="#id"> needs no second request. -->
<!--ICONS-->
<!-- Proposed icons, drawn to the sprite rules (24 px grid, 1.5 stroke, round caps). Candidates for brand/icons.svg, used for the type-of-work tags. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="rcp-research" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 4 5v14c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5z"/><path d="M12 6.5v14"/></g></symbol>
  <symbol id="rcp-culture" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></g></symbol>
</svg>
<div class="proto-root">
  <header class="proto-bar" aria-label="Prototype controls">
    <p class="proto-bar-title">Prototype<small>Weave, first version · fictional content · nothing is sent or stored</small></p>
    <div class="proto-control">
      <label for="proto-screen">Screen</label>
      <select id="proto-screen" name="screen"></select>
    </div>
    <div class="proto-control">
      <span id="proto-step-label">Step</span>
      <div class="proto-step" role="group" aria-labelledby="proto-step-label">
        <button type="button" id="proto-prev" aria-label="Previous screen">Prev</button>
        <button type="button" id="proto-next" aria-label="Next screen">Next</button>
      </div>
    </div>
    <div class="proto-control">
      <label for="proto-state">State</label>
      <select id="proto-state" name="state"></select>
    </div>
    <div class="proto-control">
      <span id="proto-theme-label">Theme</span>
      <div class="proto-seg" role="group" aria-labelledby="proto-theme-label">
        <button type="button" data-theme-choice="system" aria-pressed="true">System</button>
        <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
    <div class="proto-control">
      <span id="proto-width-label">Width</span>
      <div class="proto-seg" role="group" aria-labelledby="proto-width-label">
        <button type="button" data-width-choice="phone" aria-pressed="true">Phone 360</button>
        <button type="button" data-width-choice="desktop" aria-pressed="false">Desktop</button>
      </div>
    </div>
    <div class="proto-control">
      <span id="proto-more-label">More</span>
      <div class="proto-step" role="group" aria-labelledby="proto-more-label">
        <button type="button" id="proto-notes-toggle" aria-expanded="false" aria-controls="proto-notes">Notes</button>
        <button type="button" id="proto-reset">Reset walkthrough</button>
      </div>
    </div>
  </header>
  <div class="proto-stage" id="proto-stage" data-width="phone">
    <p class="proto-frame-label" id="proto-frame-label" aria-live="polite"></p>
    <div class="proto-device" id="proto-device">
      <div class="proto-frame" id="proto-frame" data-width="phone" role="region" aria-label="Weave screen"></div>
      <div class="rcp-toast-layer" id="proto-toast" role="status" aria-live="polite"></div>
    </div>
  </div>
  <aside class="proto-notes" id="proto-notes" hidden aria-label="Prototype notes">
<!--NOTES-->
  </aside>
  <dialog class="rc-dialog" id="proto-dialog" closedby="any" aria-labelledby="proto-dialog-title"></dialog>
</div>
<script src="proto-data.js"></script>
<script src="proto-screens.js"></script>
<script src="proto-screens-2.js"></script>
<script src="proto-app.js"></script>
